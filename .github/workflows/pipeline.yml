name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-ci-cd-pipeline

jobs:

# =========================================================
# SECURITY SCANS
# =========================================================

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # CHECKOUT SOURCE CODE
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # SETUP PYTHON
    # =====================================================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # =====================================================
    # INSTALL SEMGREP
    # =====================================================

    - name: Install Semgrep
      run: |
        pip install semgrep

    # =====================================================
    # RUN SEMGREP (NON BLOCKING)
    # =====================================================

    - name: Run Semgrep Security Scan
      run: |

        echo "=================================================="
        echo "RUNNING SEMGREP SOURCE CODE SCAN"
        echo "=================================================="

        semgrep --config=auto app.py || true

        echo "=================================================="
        echo "SEMGREP SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL GITLEAKS
    # =====================================================

    - name: Install Gitleaks
      run: |

        wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz

        tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

        sudo mv gitleaks /usr/local/bin/

    # =====================================================
    # RUN GITLEAKS (BLOCKING)
    # =====================================================

    - name: Run Gitleaks Secret Scan
      run: |

        echo "=================================================="
        echo "RUNNING GITLEAKS SECRET SCAN"
        echo "=================================================="

        gitleaks detect \
        --source . \
        --verbose \
        --redact \
        --exit-code 1

    # =====================================================
    # CUSTOM FAILURE MESSAGE
    # =====================================================

    - name: Security Failure Message
      if: failure()
      run: |

        echo "=================================================="
        echo "PIPELINE FAILED"
        echo "=================================================="
        echo "Reason:"
        echo "Gitleaks detected hardcoded AWS credentials"
        echo "inside application source code."
        echo "=================================================="
        echo "Security Enforcement Layers:"
        echo "1. Semgrep  - Static Application Security Testing"
        echo "2. Gitleaks - Secret Detection"
        echo "=================================================="
        echo "Hardcoded credentials violate enterprise"
        echo "DevSecOps security policies."
        echo "=================================================="
        echo "Recommendation:"
        echo "Use HashiCorp Vault or GitHub Secrets."
        echo "=================================================="

        exit 1

    # =====================================================
    # CREATE TERRAFORM FILE
    # =====================================================

    - name: Create Secure Terraform File
      run: |

        mkdir -p terraform

        cat > terraform/main.tf << 'EOF'
        provider "aws" {
          region = "ap-south-1"
        }

        resource "aws_s3_bucket" "secure_bucket" {
          bucket = "enterprise-devsecops-secure-demo-bucket"

          tags = {
            Name = "SecureBucket"
          }
        }

        resource "aws_s3_bucket_public_access_block" "secure_access" {
          bucket = aws_s3_bucket.secure_bucket.id

          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
        EOF

    # =====================================================
    # INSTALL CHECKOV
    # =====================================================

    - name: Install Checkov
      run: |
        pip install checkov

    # =====================================================
    # RUN CHECKOV (NON BLOCKING)
    # =====================================================

    - name: Run Checkov Scan
      run: |
        checkov -d . --soft-fail

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |

        sudo apt-get update

        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update

        sudo apt-get install trivy -y

    # =====================================================
    # RUN TRIVY FILE SYSTEM SCAN
    # =====================================================

    - name: Run Dependency Scan
      run: |

        trivy fs . --severity HIGH,CRITICAL

# =========================================================
# BUILD AND PUSH IMAGE
# =========================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scans

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # IMPORT VAULT SECRETS
    # =====================================================

    - name: Import Secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub username | DOCKER_USERNAME ;
          secret/data/dockerhub token | DOCKER_PASSWORD ;
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    # =====================================================
    # LOGIN TO DOCKER HUB
    # =====================================================

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

    # =====================================================
    # BUILD IMAGE
    # =====================================================

    - name: Build Docker Image
      run: |

        docker build -t ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

    # =====================================================
    # PUSH IMAGE
    # =====================================================

    - name: Push Docker Image
      run: |

        docker push ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# DEPLOY DEVELOPMENT ENVIRONMENT
# =========================================================

  deploy-development:
    name: Deploy Development Environment
    runs-on: self-hosted
    needs: build-and-push

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Deploy Development Container
      run: |

        docker rm -f dev-container || true

        docker run -d \
        --name dev-container \
        -p 5001:5000 \
        -e ENVIRONMENT=DEVELOPMENT \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# DEPLOY STAGING ENVIRONMENT
# =========================================================

  deploy-staging:
    name: Deploy Staging Environment
    runs-on: self-hosted
    needs: deploy-development

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Deploy Staging Container
      run: |

        docker rm -f staging-container || true

        docker run -d \
        --name staging-container \
        -p 5002:5000 \
        -e ENVIRONMENT=STAGING \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# DEPLOY PRODUCTION ENVIRONMENT
# =========================================================

  deploy-production:
    name: Deploy Production Environment
    runs-on: self-hosted
    needs: deploy-staging

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Deploy Production Container
      run: |

        docker rm -f prod-container || true

        docker run -d \
        --name prod-container \
        -p 5003:5000 \
        -e ENVIRONMENT=PRODUCTION \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
