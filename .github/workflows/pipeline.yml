name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-ci-cd-pipeline

jobs:

# =========================================================
# SECURITY SCANS
# =========================================================

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # CHECKOUT SOURCE CODE
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # SETUP PYTHON
    # =====================================================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # =====================================================
    # INSTALL DEPENDENCIES
    # =====================================================

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # =====================================================
    # INSTALL SEMGREP
    # =====================================================

    - name: Install Semgrep
      run: |
        pip install semgrep

    # =====================================================
    # RUN SEMGREP
    # =====================================================

    - name: Run Semgrep Scan
      run: |

        echo "=================================================="
        echo "RUNNING SEMGREP SECURITY SCAN"
        echo "=================================================="

        semgrep --config=auto . || true

        echo "=================================================="
        echo "SEMGREP SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL GITLEAKS
    # =====================================================

    - name: Install Gitleaks
      run: |

        wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz

        tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

        sudo mv gitleaks /usr/local/bin/

    # =====================================================
    # RUN GITLEAKS
    # =====================================================

    - name: Run Gitleaks Scan
      run: |

        echo "=================================================="
        echo "RUNNING GITLEAKS SECRET SCAN"
        echo "=================================================="

        gitleaks detect \
        --source . \
        --verbose \
        --redact || true

    # =====================================================
    # CREATE TERRAFORM FILE
    # =====================================================

    - name: Create Secure Terraform File
      run: |

        mkdir -p terraform

        cat > terraform/main.tf << 'EOF'
        provider "aws" {
          region = "ap-south-1"
        }

        resource "aws_s3_bucket" "secure_bucket" {
          bucket = "enterprise-devsecops-secure-demo-bucket"

          tags = {
            Name = "SecureBucket"
          }
        }
        EOF

    # =====================================================
    # INSTALL CHECKOV
    # =====================================================

    - name: Install Checkov
      run: |
        pip install checkov

    # =====================================================
    # RUN CHECKOV
    # =====================================================

    - name: Run Checkov Scan
      run: |
        checkov -d . --soft-fail

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |

        sudo apt-get update

        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update

        sudo apt-get install trivy -y

    # =====================================================
    # RUN TRIVY DEPENDENCY SCAN
    # =====================================================

    - name: Run Trivy Dependency Scan
      run: |

        echo "=================================================="
        echo "RUNNING TRIVY DEPENDENCY SCAN"
        echo "=================================================="

        trivy fs . \
        --severity HIGH,CRITICAL \
        --exit-code 1

    # =====================================================
    # CUSTOM FAILURE MESSAGE
    # =====================================================

    - name: Dependency Security Failure Message
      if: failure()
      run: |

        echo "=================================================="
        echo "PIPELINE FAILED"
        echo "=================================================="
        echo "Reason:"
        echo "Vulnerable dependencies detected inside application."
        echo "Third-party libraries contain HIGH or CRITICAL CVEs."
        echo "=================================================="
        echo "Security Layer:"
        echo "Trivy Dependency Vulnerability Scanner"
        echo "=================================================="
        echo "Recommendation:"
        echo "Upgrade vulnerable dependencies immediately."
        echo "=================================================="

        exit 1

# =========================================================
# BUILD AND PUSH IMAGE
# =========================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scans

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # IMPORT VAULT SECRETS
    # =====================================================

    - name: Import Secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub username | DOCKER_USERNAME ;
          secret/data/dockerhub token | DOCKER_PASSWORD ;
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    # =====================================================
    # LOGIN TO DOCKER HUB
    # =====================================================

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

    # =====================================================
    # BUILD IMAGE
    # =====================================================

    - name: Build Docker Image
      run: |

        docker build -t ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

    # =====================================================
    # PUSH IMAGE
    # =====================================================

    - name: Push Docker Image
      run: |

        docker push ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
