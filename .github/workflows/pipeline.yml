name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-ci-cd-pipeline

jobs:

# =========================================================
# STAGE 1 - SECURITY SCANS
# =========================================================

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # CHECKOUT REPOSITORY
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # SETUP PYTHON
    # =====================================================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # =====================================================
    # INSTALL DEPENDENCIES
    # =====================================================

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # =====================================================
    # CLEAN OLD REPORTS
    # =====================================================

    - name: Clean Old Reports
      run: |

        echo "=================================================="
        echo "CLEANING OLD SECURITY REPORTS"
        echo "=================================================="

        rm -rf reports
        mkdir -p reports

    # =====================================================
    # INSTALL SEMGREP
    # =====================================================

    - name: Install Semgrep
      run: |
        pip install semgrep

    # =====================================================
    # RUN SEMGREP SCAN
    # =====================================================

    - name: Run Semgrep Scan
      run: |

        echo "=================================================="
        echo "RUNNING SEMGREP SOURCE CODE SECURITY SCAN"
        echo "=================================================="

        semgrep \
        --config=auto \
        --json \
        --output reports/semgrep-report.json \
        . || true

        echo "=================================================="
        echo "SEMGREP SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL GITLEAKS
    # =====================================================

    - name: Install Gitleaks
      run: |

        wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz

        tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

        sudo mv gitleaks /usr/local/bin/

    # =====================================================
    # RUN GITLEAKS SCAN
    # =====================================================

    - name: Run Gitleaks Scan
      run: |

        echo "=================================================="
        echo "RUNNING GITLEAKS SECRET SCAN"
        echo "=================================================="

        rm -f reports/gitleaks-report.json

        gitleaks detect \
        --no-git \
        --source . \
        --report-format json \
        --report-path reports/gitleaks-report.json \
        --redact \
        --exit-code 0

        echo "=================================================="
        echo "GITLEAKS SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL CHECKOV
    # =====================================================

    - name: Install Checkov
      run: |
        pip install checkov

    # =====================================================
    # RUN CHECKOV SCAN
    # =====================================================

    - name: Run Checkov IaC Security Scan
      run: |

        echo "=================================================="
        echo "RUNNING CHECKOV IaC SECURITY SCAN"
        echo "=================================================="

        rm -f reports/checkov-report.json

        checkov -d terraform \
        --framework terraform \
        --skip-check CKV2_AWS_62,CKV2_AWS_64,CKV_AWS_144 \
        --output json \
        > reports/checkov-report.json || true

        echo "=================================================="
        echo "CHECKOV SECURITY SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # UPLOAD SECURITY REPORTS
    # =====================================================

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-artifacts
        path: reports/

# =========================================================
# STAGE 2 - SECURITY POLICY GATE
# =========================================================

  policy-gate:
    name: Security Policy Gate
    runs-on: ubuntu-latest
    needs: security-scans

    steps:

    # =====================================================
    # CLEAN POLICY REPORTS
    # =====================================================

    - name: Clean Existing Reports
      run: |

        rm -rf reports
        mkdir -p reports

    # =====================================================
    # DOWNLOAD REPORTS
    # =====================================================

    - name: Download Security Reports
      uses: actions/download-artifact@v4
      with:
        name: security-scan-artifacts
        path: reports

    # =====================================================
    # VERIFY REPORTS
    # =====================================================

    - name: Verify Reports
      run: |

        echo "=================================================="
        echo "VERIFYING SECURITY REPORTS"
        echo "=================================================="

        ls -la reports/

    # =====================================================
    # VALIDATE GITLEAKS POLICY
    # =====================================================

    - name: Validate Gitleaks Policy
      run: |

        echo "=================================================="
        echo "VALIDATING GITLEAKS POLICY"
        echo "=================================================="

        if [ -s reports/gitleaks-report.json ] && \
           grep -q '"RuleID"' reports/gitleaks-report.json; then

          echo "❌ SECRET DETECTED BY GITLEAKS"
          echo "❌ POLICY GATE FAILED"
          echo "❌ PIPELINE BLOCKED"

          exit 1

        else

          echo "✅ GITLEAKS POLICY PASSED"

        fi

    # =====================================================
    # VALIDATE SEMGREP POLICY
    # =====================================================

    - name: Validate Semgrep Policy
      run: |

        echo "=================================================="
        echo "VALIDATING SEMGREP POLICY"
        echo "=================================================="

        if grep -q '"severity":"ERROR"' reports/semgrep-report.json; then

          echo "❌ HIGH RISK CODE ISSUE DETECTED"
          exit 1

        else

          echo "✅ SEMGREP POLICY PASSED"

        fi

    # =====================================================
    # VALIDATE CHECKOV POLICY
    # =====================================================

    - name: Validate Checkov Policy
      run: |

        echo "=================================================="
        echo "VALIDATING CHECKOV POLICY"
        echo "=================================================="

        if grep -q '"failed"' reports/checkov-report.json; then

          echo "❌ IaC SECURITY MISCONFIGURATION DETECTED"
          exit 1

        else

          echo "✅ CHECKOV POLICY PASSED"

        fi

    # =====================================================
    # POLICY GATE PASSED
    # =====================================================

    - name: Policy Gate Passed
      run: |

        echo "=================================================="
        echo "✅ ALL SECURITY POLICIES PASSED"
        echo "=================================================="

# =========================================================
# STAGE 3 - BUILD IMAGE & IMAGE SCAN
# =========================================================

  build-and-image-scan:
    name: Build Docker Image And Scan
    runs-on: ubuntu-latest
    needs: policy-gate

    steps:

    # =====================================================
    # CHECKOUT REPOSITORY
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # CLEAN REPORTS
    # =====================================================

    - name: Clean Reports
      run: |

        rm -rf reports
        mkdir -p reports

    # =====================================================
    # IMPORT VAULT SECRETS
    # =====================================================

    - name: Import Secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub username | DOCKER_USERNAME ;
          secret/data/dockerhub token | DOCKER_PASSWORD ;
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    # =====================================================
    # DOCKER LOGIN
    # =====================================================

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

    # =====================================================
    # BUILD IMAGE
    # =====================================================

    - name: Build Docker Image
      run: |

        echo "=================================================="
        echo "BUILDING DOCKER IMAGE"
        echo "=================================================="

        docker build --no-cache \
        -t ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |

        sudo apt-get update -y
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update -y
        sudo apt-get install trivy -y

    # =====================================================
    # RUN TRIVY IMAGE SCAN
    # =====================================================

    - name: Run Trivy Docker Image Scan
      run: |

        echo "=================================================="
        echo "RUNNING TRIVY IMAGE SCAN"
        echo "=================================================="

        trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --format json \
        --output reports/trivy-report.json \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    # =====================================================
    # VALIDATE TRIVY POLICY
    # =====================================================

    - name: Validate Trivy Policy
      run: |

        echo "=================================================="
        echo "VALIDATING TRIVY POLICY"
        echo "=================================================="

        if grep -q '"Severity":"CRITICAL"' reports/trivy-report.json; then

          echo "❌ CRITICAL IMAGE VULNERABILITY DETECTED"
          exit 1

        else

          echo "✅ TRIVY POLICY PASSED"

        fi

    # =====================================================
    # PUSH IMAGE
    # =====================================================

    - name: Push Docker Image
      run: |

        echo "=================================================="
        echo "PUSHING IMAGE TO DOCKER HUB"
        echo "=================================================="

        docker push \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# STAGE 4 - DEVELOPMENT DEPLOYMENT
# =========================================================

  deploy-development:
    name: Deploy Development Environment
    runs-on: self-hosted
    needs: build-and-image-scan

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Pull Docker Image
      run: |

        docker pull \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy Development Container
      run: |

        docker rm -f dev-container || true

        docker run -d \
        --name dev-container \
        -p 5001:5000 \
        -e ENVIRONMENT=DEVELOPMENT \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# STAGE 5 - STAGING DEPLOYMENT
# =========================================================

  deploy-staging:
    name: Deploy Staging Environment
    runs-on: self-hosted
    needs: deploy-development

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Pull Docker Image
      run: |

        docker pull \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy Staging Container
      run: |

        docker rm -f staging-container || true

        docker run -d \
        --name staging-container \
        -p 5002:5000 \
        -e ENVIRONMENT=STAGING \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# STAGE 6 - PRODUCTION DEPLOYMENT
# =========================================================

  deploy-production:
    name: Deploy Production Environment
    runs-on: self-hosted
    needs: deploy-staging

    steps:

    - name: Import Vault Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Pull Docker Image
      run: |

        docker pull \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy Production Container
      run: |

        docker rm -f prod-container || true

        docker run -d \
        --name prod-container \
        -p 5003:5000 \
        -e ENVIRONMENT=PRODUCTION \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
