name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-ci-cd-pipeline

jobs:

# =========================================================
# SECURITY SCANS
# =========================================================

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # CHECKOUT SOURCE CODE
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # SETUP PYTHON
    # =====================================================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # =====================================================
    # INSTALL SEMGREP
    # =====================================================

    - name: Install Semgrep
      run: |
        pip install semgrep

    # =====================================================
    # SCAN APP.PY FOR HARDCODED SECRETS
    # =====================================================

    - name: Scan Source Code Secrets
      run: |
        echo "Scanning app.py for hardcoded AWS credentials..."

        semgrep \
        --config=p/secrets \
        --error \
        app.py

    # =====================================================
    # CUSTOM FAILURE MESSAGE
    # =====================================================

    - name: Security Failure Message
      if: failure()
      run: |
        echo "=================================================="
        echo "PIPELINE FAILED"
        echo "=================================================="
        echo "Reason:"
        echo "Hardcoded AWS credentials detected inside app.py"
        echo "Sensitive secrets were injected into source code."
        echo "This violates DevSecOps security policies."
        echo "Please move credentials to Vault or GitHub Secrets."
        echo "=================================================="
        exit 1

    # =====================================================
    # SECRET SCAN - GITLEAKS
    # =====================================================

    - name: Run Gitleaks Scan
      run: |
        docker run --rm \
        -v ${{ github.workspace }}:/path \
        zricethezav/gitleaks:latest detect \
        --source="/path" \
        --verbose \
        --redact

    # =====================================================
    # CREATE SECURE TERRAFORM FILE
    # =====================================================

    - name: Create Secure Terraform File
      run: |
        mkdir -p terraform

        cat > terraform/main.tf << 'EOF'
        provider "aws" {
          region = "ap-south-1"
        }

        resource "aws_s3_bucket" "secure_bucket" {
          bucket = "enterprise-devsecops-secure-demo-bucket"

          tags = {
            Name = "SecureBucket"
          }
        }

        resource "aws_s3_bucket_public_access_block" "secure_access" {
          bucket = aws_s3_bucket.secure_bucket.id

          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }

        resource "aws_s3_bucket_versioning" "versioning" {
          bucket = aws_s3_bucket.secure_bucket.id

          versioning_configuration {
            status = "Enabled"
          }
        }

        resource "aws_s3_bucket_server_side_encryption_configuration" "encryption" {
          bucket = aws_s3_bucket.secure_bucket.id

          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm = "AES256"
            }
          }
        }

        resource "aws_s3_bucket_lifecycle_configuration" "lifecycle" {
          bucket = aws_s3_bucket.secure_bucket.id

          rule {
            id     = "log"
            status = "Enabled"

            expiration {
              days = 90
            }
          }
        }

        resource "aws_s3_bucket_acl" "bucket_acl" {
          bucket = aws_s3_bucket.secure_bucket.id
          acl    = "private"
        }
        EOF

    # =====================================================
    # INSTALL CHECKOV
    # =====================================================

    - name: Install Checkov
      run: |
        pip install checkov

    # =====================================================
    # RUN CHECKOV
    # =====================================================

    - name: Run Checkov Scan
      run: |
        checkov -d . --soft-fail

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install trivy -y

    # =====================================================
    # FILE SYSTEM SCAN
    # =====================================================

    - name: Run Dependency Scan
      run: |
        trivy fs . --severity HIGH,CRITICAL

# =========================================================
# BUILD AND PUSH IMAGE
# =========================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scans

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # IMPORT VAULT SECRETS
    # =====================================================

    - name: Import Secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub username | DOCKER_USERNAME ;
          secret/data/dockerhub token | DOCKER_PASSWORD ;
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    # =====================================================
    # LOGIN TO DOCKER HUB
    # =====================================================

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

    # =====================================================
    # BUILD IMAGE
    # =====================================================

    - name: Build Docker Image
      run: |
        docker build -t ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install trivy -y

    # =====================================================
    # IMAGE SCAN
    # =====================================================

    - name: Scan Docker Image
      run: |
        trivy image \
        --severity HIGH,CRITICAL \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    # =====================================================
    # PUSH IMAGE
    # =====================================================

    - name: Push Docker Image
      run: |
        docker push ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# =========================================================
# DEPLOY DEV
# =========================================================

  deploy-dev:
    name: Deploy Dev Environment
    runs-on: self-hosted
    needs: build-and-push

    steps:

    - name: Import Repository Secret
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    - name: Pull Docker Image
      run: |
        docker pull ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Remove Old Dev Container
      run: |
        docker rm -f dev-container || true

    - name: Run Dev Container
      run: |
        docker run -d \
        --name dev-container \
        -p 5001:5000 \
        -e ENVIRONMENT=DEV \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
