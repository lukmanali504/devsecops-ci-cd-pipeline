name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-ci-cd-pipeline

jobs:

# =========================================================
# SECURITY SCANS
# =========================================================

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # CHECKOUT REPOSITORY
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # SETUP PYTHON
    # =====================================================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # =====================================================
    # INSTALL DEPENDENCIES
    # =====================================================

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # =====================================================
    # CREATE REPORT DIRECTORY
    # =====================================================

    - name: Create Reports Directory
      run: |
        mkdir -p reports

    # =====================================================
    # INSTALL SEMGREP
    # =====================================================

    - name: Install Semgrep
      run: |
        pip install semgrep

    # =====================================================
    # RUN SEMGREP SCAN
    # =====================================================

    - name: Run Semgrep Scan
      run: |

        echo "=================================================="
        echo "RUNNING SEMGREP SOURCE CODE SECURITY SCAN"
        echo "=================================================="

        semgrep \
        --config=auto \
        --json \
        --output reports/semgrep-report.json \
        . || true

        echo "=================================================="
        echo "SEMGREP SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL GITLEAKS
    # =====================================================

    - name: Install Gitleaks
      run: |

        wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz

        tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

        sudo mv gitleaks /usr/local/bin/

    # =====================================================
    # RUN GITLEAKS SCAN
    # =====================================================

    - name: Run Gitleaks Scan
      run: |

        echo "=================================================="
        echo "RUNNING GITLEAKS SECRET SCAN"
        echo "=================================================="

        gitleaks detect \
        --source . \
        --report-format json \
        --report-path reports/gitleaks-report.json \
        --redact \
        --exit-code 0

        echo "=================================================="
        echo "GITLEAKS SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL CHECKOV
    # =====================================================

    - name: Install Checkov
      run: |
        pip install checkov

    # =====================================================
    # RUN CHECKOV SCAN
    # =====================================================

    - name: Run Checkov IaC Security Scan
      run: |

        echo "=================================================="
        echo "RUNNING CHECKOV IaC SECURITY SCAN"
        echo "=================================================="

        checkov -d terraform \
        --framework terraform \
        --skip-check CKV2_AWS_62,CKV2_AWS_64,CKV_AWS_144 \
        --output json \
        > reports/checkov-report.json || true

        echo "=================================================="
        echo "CHECKOV SECURITY SCAN COMPLETED"
        echo "=================================================="

    # =====================================================
    # UPLOAD SECURITY REPORTS
    # =====================================================

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-artifacts
        path: reports/

# =========================================================
# SECURITY POLICY GATE
# =========================================================

  policy-gate:
    name: Security Policy Gate
    runs-on: ubuntu-latest
    needs: security-scans

    steps:

    # =====================================================
    # DOWNLOAD SECURITY REPORTS
    # =====================================================

    - name: Download Security Reports
      uses: actions/download-artifact@v4
      with:
        name: security-scan-artifacts
        path: reports

    # =====================================================
    # VALIDATE GITLEAKS POLICY
    # =====================================================

    - name: Validate Gitleaks Security Policy
      run: |

        echo "=================================================="
        echo "VALIDATING GITLEAKS SECURITY POLICY"
        echo "=================================================="

        echo "Checking for AWS credentials and secrets..."

        if [ -s reports/gitleaks-report.json ] && \
           grep -q '"RuleID"' reports/gitleaks-report.json; then

          echo "❌ SECRET DETECTED BY GITLEAKS"
          echo "❌ POLICY GATE FAILED"
          echo "❌ PIPELINE BLOCKED"

          exit 1

        else

          echo "✅ NO SECRETS DETECTED"

        fi

    # =====================================================
    # VALIDATE SEMGREP POLICY
    # =====================================================

    - name: Validate Semgrep Security Policy
      run: |

        echo "=================================================="
        echo "VALIDATING SEMGREP SECURITY POLICY"
        echo "=================================================="

        if grep -q '"severity":"ERROR"' reports/semgrep-report.json; then

          echo "❌ HIGH RISK SOURCE CODE ISSUE DETECTED"
          exit 1

        else

          echo "✅ SEMGREP POLICY VALIDATION PASSED"

        fi

    # =====================================================
    # VALIDATE CHECKOV POLICY
    # =====================================================

    - name: Validate Checkov Security Policy
      run: |

        echo "=================================================="
        echo "VALIDATING CHECKOV SECURITY POLICY"
        echo "=================================================="

        if grep -q '"failed"' reports/checkov-report.json; then

          echo "❌ IaC SECURITY MISCONFIGURATION DETECTED"
          exit 1

        else

          echo "✅ CHECKOV POLICY VALIDATION PASSED"

        fi

    # =====================================================
    # POLICY GATE SUCCESS
    # =====================================================

    - name: Security Policy Gate Passed
      run: |

        echo "=================================================="
        echo "✅ ALL SECURITY POLICIES PASSED"
        echo "=================================================="

# =========================================================
# BUILD IMAGE AND IMAGE SECURITY SCAN
# =========================================================

  build-and-image-scan:
    name: Build Docker Image And Scan
    runs-on: ubuntu-latest
    needs: policy-gate

    steps:

    # =====================================================
    # CHECKOUT REPOSITORY
    # =====================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # =====================================================
    # CREATE REPORT DIRECTORY
    # =====================================================

    - name: Create Reports Directory
      run: |
        mkdir -p reports

    # =====================================================
    # IMPORT VAULT SECRETS
    # =====================================================

    - name: Import Secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}

        secrets: |
          secret/data/dockerhub username | DOCKER_USERNAME ;
          secret/data/dockerhub token | DOCKER_PASSWORD ;
          secret/data/dockerhub repo | DOCKER_REPOSITORY

    # =====================================================
    # LOGIN TO DOCKER HUB
    # =====================================================

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

    # =====================================================
    # BUILD DOCKER IMAGE
    # =====================================================

    - name: Build Docker Image
      run: |

        echo "=================================================="
        echo "BUILDING DOCKER IMAGE"
        echo "=================================================="

        docker build --no-cache \
        -t ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

        echo "=================================================="
        echo "DOCKER IMAGE BUILD COMPLETED"
        echo "=================================================="

    # =====================================================
    # INSTALL TRIVY
    # =====================================================

    - name: Install Trivy
      run: |

        sudo apt-get update -y

        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb \
        $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update -y

        sudo apt-get install trivy -y

    # =====================================================
    # RUN TRIVY IMAGE SCAN
    # =====================================================

    - name: Run Trivy Docker Image Scan
      run: |

        echo "=================================================="
        echo "RUNNING TRIVY IMAGE SECURITY SCAN"
        echo "=================================================="

        trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --format json \
        --output reports/trivy-report.json \
        ${{ steps.vault.outputs.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

        echo "=================================================="
        echo "TRIVY IMAGE SCAN COMPLETED"
        echo "=================================================="

# =========================================================
# DEPLOYMENT STAGES
# =========================================================

# THIS WILL NOT RUN IF POLICY GATE FAILS
